on:
  push:
    branches:
      - master
  release:
    types:
      - created

name: Publish NPM package
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: clean
        run: make clean
      - name: install
        run: yarn install --frozen-lockfile
      - name: build & test & publish
        run: make ci
      - name: print diff if failed
        if: ${{ failure() }}
        run: cp dist/temp/eth-connect.api.md report/eth-connect.api.md && git diff
      - name: Publish
        uses: decentraland/oddish-action@0074f2d535c43b5c83f136525304a6277166d77f # @master
        with:
          cwd: ./dist
          provenance: true
      - name: report coverage
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # @master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
